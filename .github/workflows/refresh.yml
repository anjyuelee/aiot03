name: Refresh weather seed DB

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret is not set; skipping redeploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
